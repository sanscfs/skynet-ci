name: Reusable Skynet build

on:
  workflow_call:
    inputs:
      component:
        description: "Image name (e.g. skynet-identity, skynet-base)"
        required: true
        type: string
      context:
        description: "Build context path"
        default: "."
        type: string
      dockerfile:
        description: "Path to Dockerfile relative to context"
        default: "Dockerfile"
        type: string
      platforms:
        description: "Comma-separated buildx platforms"
        default: "linux/amd64,linux/arm64"
        type: string
      build-args:
        description: "Extra --build-arg lines (KEY=VAL, one per line)"
        default: ""
        type: string
      extra-tags:
        description: "Extra tags to push (one per line, fully-qualified)"
        default: ""
        type: string
      tag-latest:
        description: "Push <component>:latest and <component>:py3.12 style rolling tag"
        default: true
        type: boolean
      rolling-tag:
        description: "Rolling tag value (e.g. 'latest' or 'py3.12'); defaults to 'latest'"
        default: "latest"
        type: string
      bump-infra:
        description: "After a successful build, commit the image SHA to sanscfs/infra (skynet-apps/ or infra-apps/ values.yaml + manifests/ deployments)."
        default: true
        type: boolean
    secrets:
      NEXUS_PASSWORD:
        required: true
      INFRA_REPO_TOKEN:
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: [self-hosted, linux, x64, k3s]
    steps:
      - uses: actions/checkout@v4

      # Build & push via the runner's dind sidecar — bypassing remote
      # buildkit entirely. buildkit's push pipeline trips a GHCR API
      # mismatch we couldn't shake (``GET /v2/<repo>/blobs/uploads/``
      # → 405 Method Not Allowed across buildkit v0.16.0, v0.20.2,
      # v0.21.0 and build-push-action v5/v6). Plain ``docker build``
      # uses the OCI v2 spec endpoints GHCR actually implements
      # (``POST /v2/.../blobs/uploads/`` to start, ``PUT
      # ?digest=...`` to finalize) and pushes successfully.
      #
      # Cost: no multi-arch (Buildx is what gives us that). Acceptable
      # because every Skynet component currently builds linux/amd64
      # only — the inputs.platforms knob defaults to that and nobody
      # overrides it.

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (dind, no buildkit)
        env:
          COMPONENT: ${{ inputs.component }}
          CONTEXT: ${{ inputs.context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          BUILD_ARGS: ${{ inputs.build-args }}
          SHA: ${{ github.sha }}
          ROLLING: ${{ inputs.rolling-tag }}
          TAG_LATEST: ${{ inputs.tag-latest }}
          EXTRA_TAGS: ${{ inputs.extra-tags }}
        run: |
          set -euo pipefail
          primary="ghcr.io/sanscfs/${COMPONENT}:${SHA}"

          # Build args: each line "KEY=VAL" -> "--build-arg KEY=VAL"
          ba=()
          while IFS= read -r line; do
            [ -n "$line" ] && ba+=("--build-arg" "$line")
          done <<< "${BUILD_ARGS:-}"

          docker build \
            -f "${CONTEXT}/${DOCKERFILE}" \
            -t "${primary}" \
            "${ba[@]}" \
            "${CONTEXT}"

          docker push "${primary}"

          # Optional rolling tag (latest / py3.12 / etc.)
          if [ "${TAG_LATEST}" = "true" ]; then
            rolling_tag="ghcr.io/sanscfs/${COMPONENT}:${ROLLING}"
            docker tag "${primary}" "${rolling_tag}"
            docker push "${rolling_tag}"
          fi

          # Optional extra tags from inputs
          if [ -n "${EXTRA_TAGS:-}" ]; then
            while IFS= read -r tag; do
              [ -z "$tag" ] && continue
              docker tag "${primary}" "$tag"
              docker push "$tag"
            done <<< "${EXTRA_TAGS}"
          fi

  bump-infra:
    if: ${{ inputs.bump-infra && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: [self-hosted, linux, x64, k3s]
    steps:
      - name: Clone and update infra
        env:
          TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
          COMPONENT: ${{ inputs.component }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "INFRA_REPO_TOKEN not set — skipping bump." ; exit 0
          fi
          tmp=$(mktemp -d)
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/sanscfs/infra.git" "$tmp"
          cd "$tmp"
          git config user.name "Skynet CI"
          git config user.email "skynet@sanscfs.dev"
          updated=false
          for values in "skynet-apps/${COMPONENT}/values.yaml" "infra-apps/${COMPONENT}/values.yaml"; do
            if [ -f "$values" ]; then
              sed -i "s|^\(  tag: \).*|\1\"${TAG}\"|" "$values"
              updated=true
            fi
          done
          kd="manifests/${COMPONENT}/deployment.yaml"
          if [ -f "$kd" ]; then
            sed -i "s|image:.*${COMPONENT}.*|image: ghcr.io/sanscfs/${COMPONENT}:${TAG}|" "$kd"
            updated=true
          fi
          if [ "$updated" = "true" ]; then
            git add -A
            git diff --cached --quiet \
              || git commit -m "ci(${COMPONENT}): update image to ${TAG}"
            git push
          else
            echo "No matching values.yaml / deployment.yaml for ${COMPONENT}; skipping."
          fi
